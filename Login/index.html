<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf2f8"><title>RPCPH CRM — ID KEY Login</title>
<style>
:root{--navy:#012169;--blue:#418FDE;--ink:#142238;--muted:#718096}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100vh;display:grid;place-items:center;padding:22px;background:#edf2f8 url('/luxury-building-wallpaper.svg') center/cover fixed no-repeat}.veil{position:fixed;inset:0;background:rgba(244,248,253,.48)}.login{position:relative;width:min(430px,100%);padding:34px;border:1px solid rgba(255,255,255,.84);border-radius:22px;background:rgba(255,255,255,.48);backdrop-filter:blur(26px) saturate(160%);box-shadow:0 22px 65px rgba(20,40,70,.12),inset 0 1px rgba(255,255,255,.9)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}.mark{width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}.brand strong{display:block;font-size:15px}.brand small{display:block;color:#718096;font-size:9px;letter-spacing:1.7px;margin-top:3px}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:800;color:#6480a4}.title{font-size:34px;letter-spacing:-1.5px;margin:9px 0 8px;font-weight:600}.desc{font-size:12px;line-height:1.6;color:#718096;margin:0 0 27px}.field label{display:block;font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:8px;color:#52647c}.field input{width:100%;height:52px;border:1px solid rgba(1,33,105,.17);border-radius:11px;background:rgba(255,255,255,.76);padding:0 15px;font-size:15px;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(65,143,222,.12)}button{width:100%;height:50px;border:0;border-radius:11px;background:var(--navy);color:white;font-weight:750;margin-top:17px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:14px;padding:11px 12px;border-radius:9px;font-size:11px;line-height:1.5}.status.show{display:block}.status.error{background:#fff0ef;color:#9b3830}.status.good{background:#eaf7f0;color:#26734e}.foot{text-align:center;color:#8995a7;font-size:10px;margin-top:23px}
</style><script>document.documentElement.classList.add("auth-pending")</script><script src="/local-auth.js"></script></head>
<body><div class="veil"></div><main class="login"><div class="brand"><div class="mark">R.</div><div><strong>RPCPH CRM</strong><small>LOCAL ACCESS</small></div></div><div class="eyebrow">SECURE STAFF SIGN-IN</div><h1 class="title">Welcome back.</h1><p class="desc">Enter the ID KEY issued to you by your CRM administrator. No email or separate password is required.</p><form id="loginForm"><div class="field"><label for="idKey">ID KEY</label><input id="idKey" type="password" autocomplete="current-password" placeholder="Enter your ID KEY" required autofocus></div><button id="loginBtn" type="submit">Sign in to RPCPH CRM</button></form><div id="status" class="status" role="status"></div><div class="foot">Local account access · Sessions expire after 8 hours</div></main>
<script>
const form=document.getElementById("loginForm"),btn=document.getElementById("loginBtn"),statusEl=document.getElementById("status");
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;btn.textContent="Signing in…";statusEl.className="status";try{const result=await RPCPHAuth.api("login",{id_key:document.getElementById("idKey").value});RPCPHAuth.saveToken(result.token);statusEl.textContent="Signed in. Opening your workspace…";statusEl.className="status show good";location.replace("/");}catch(err){statusEl.textContent=err.message||"Sign-in failed";statusEl.className="status show error";}finally{btn.disabled=false;btn.textContent="Sign in to RPCPH CRM";}});
</script></body></html>
